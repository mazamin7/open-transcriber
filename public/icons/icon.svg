<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#1e1e1e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#333" stroke-width="8"/>
  <!-- Sound Waves -->
  <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" opacity="0.4"/>
  <path d="M 150 256 A 106 106 0 0 1 362 256" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" opacity="0.8"/>
  <!-- Microphone Body -->
  <rect x="220" y="140" width="72" height="150" rx="36" fill="url(#accent)" />
  <!-- Microphone Stand -->
  <path d="M 180 230 A 76 76 0 0 0 332 230" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <line x1="256" y1="306" x2="256" y2="380" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <line x1="200" y1="380" x2="312" y2="380" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <!-- Deaf / Ear accessibility badge -->
  <circle cx="370" cy="370" r="64" fill="#00e676" />
  <path d="M 355 350 C 355 335 385 335 385 355 C 385 375 365 380 365 395" fill="none" stroke="#121212" stroke-width="8" stroke-linecap="round"/>
  <circle cx="365" cy="410" r="4" fill="#121212"/>
</svg>
